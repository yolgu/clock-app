name: Android quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 25

      - name: Install pinned Flutter bootstrap SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable

      - name: Restore FVM and pub caches
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.pub-cache
            .fvm/cache
          key: android-flutter-3.44.7-${{ hashFiles('pubspec.lock') }}

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure FVM 4.1.2
        shell: bash
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/fvm" config --cache-path "$GITHUB_WORKSPACE/.fvm/cache"
          "$HOME/.pub-cache/bin/fvm" install 3.44.7
          "$HOME/.pub-cache/bin/fvm" use 3.44.7 --force --skip-pub-get

      - name: Verify source
        shell: pwsh
        run: ./tool/verify.ps1 -Platform Android

      - name: Package beta APK
        shell: pwsh
        run: ./tool/package_android.ps1 -Flavor Beta -Artifact Apk

      - name: Upload verified Android package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clock-rhythm-android-beta
          path: |
            artifacts/android/*.apk
            artifacts/manifest.json
            artifacts/SHA256SUMS.txt
            ASSET_NOTICE.md
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
